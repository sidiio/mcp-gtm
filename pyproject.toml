[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-mcp"
version = "0.1.0"
description = "Google Tag Manager MCP server with OAuth authentication"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1.0",
    "httpx>=0.28.1",
    "google-api-python-client>=2.0.0"
]

[project.scripts]
gtm-mcp = "gtm_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_mcp"]
